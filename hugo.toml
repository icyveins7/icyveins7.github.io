[menu]
  [[menu.main]]
    identifier  = "about"
    name        = "About"
    url         = "about/"
  #   hasChildren = true
  # 
  # [[menu.main]]
  #   identifier  = "me"
  #   name        = "About Me"
  #   url         = "about/me/"
  #   parent      = "about"

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "posts/"

[markup.goldmark.renderer]
  unsafe = true

# Enable math
[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [["\\[", "\\]"], ["$$", "$$"]]
  inline = [["\\(", "\\)"], ["$", "$"]]
